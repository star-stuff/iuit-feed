name: IUIT daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get full IUIT 69 holdings
        run: |
          pip install cloudscraper requests
          python - << 'PY'
          import cloudscraper, csv, re, datetime
          scraper = cloudscraper.create_scraper()

          # 1. Pobierz JSON holdings z iShares - pełne 69 pozycji
          asof = datetime.datetime.utcnow().strftime("%Y%m%d")
          url = f"https://www.ishares.com/uk/individual/en/products/280510/ishares-sp-500-information-technology-sector-ucits-etf/1506575576011.ajax?fileType=json&tab=all&asOfDate={asof}"
          headers = {
            "Referer": "https://www.ishares.com/uk/individual/en/products/280510/ishares-sp-500-information-technology-sector-ucits-etf/",
            "X-Requested-With": "XMLHttpRequest"
          }
          r = scraper.get(url, headers=headers, timeout=30)
          print(f"JSON status {r.status_code} len {len(r.text)}")
          data = r.json()
          rows = data.get('aaData', [])
          print(f"Found {len(rows)} holdings")

          # jeśli aaData puste, spróbuj bez asOfDate
          if len(rows) < 10:
              url2 = "https://www.ishares.com/uk/individual/en/products/280510/ishares-sp-500-information-technology-sector-ucits-etf/1506575576011.ajax?fileType=json&tab=all"
              r = scraper.get(url2, headers=headers, timeout=30)
              data = r.json()
              rows = data.get('aaData', [])
              print(f"Retry found {len(rows)}")

          # zapisz jako CSV dokładnie jak oryginał iShares
          with open('IUIT_holdings.csv','w',newline='',encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(["Ticker","Name","Sector","Asset Class","Market Value","Weight (%)","Notional Value","Shares","CUSIP","ISIN","SEDOL","Price","Location","Exchange","Currency","FX Rate"])
              for r in rows:
                  w.writerow([
                    r[0],
                    r[1],
                    r[2],
                    r[3],
                    r[4]['raw'] if isinstance(r[4], dict) else r[4],
                    r[5]['raw'] if isinstance(r[5], dict) else r[5],
                    r[6]['raw'] if isinstance(r[6], dict) else r[6],
                    r[7]['raw'] if isinstance(r[7], dict) else r[7],
                    r[8], r[9], r[10],
                    r[11]['raw'] if isinstance(r[11], dict) else r[11],
                    r[12], r[13], r[14], r[15]
                  ])
          PY
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add IUIT_holdings.csv
          git diff --staged --quiet || git commit -m "update IUIT full 69"
          git push
