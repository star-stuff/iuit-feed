name: IUIT daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get IUIT holdings
        run: |
          pip install requests beautifulsoup4 lxml
          python - << 'PY'
          import requests, csv, re
          from bs4 import BeautifulSoup

          # 1. Próba ETFdb
          try:
              url = "https://etfdb.com/etf/IUIT/"
              r = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30)
              soup = BeautifulSoup(r.text, "lxml")
              table = soup.find("table")
              holdings = []
              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")
                  if len(tds) >= 3:
                      ticker = tds[0].get_text(strip=True)
                      if ticker and len(ticker) <= 6 and ticker.isupper():
                          name = tds[1].get_text(strip=True)
                          weight = tds[2].get_text(strip=True).replace("%","")
                          holdings.append([ticker, name, weight])
              print(f"ETFdb found {len(holdings)}")
              if len(holdings) > 10:
                  raise SystemExit(0) # zapisz niżej
          except Exception as e:
              print("ETFdb fail", e)

          # 2. Fallback - JustETF profile (zawsze działa)
          isin = "IE00B4WJ7P21"
          url = f"https://www.justetf.com/en/etf-profile.html?isin={isin}"
          r = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30)
          print(f"JustETF status {r.status_code}")
          # JustETF ma top holdings w HTML
          soup = BeautifulSoup(r.text, "lxml")
          holdings = []
          for a in soup.select('[data-testid="tl_etf-holdings_top-holdings_link_name"]'):
              name = a.get('title','').strip()
              weight_el = a.find_parent('tr').select_one('[data-testid$="_percentage"]') if a.find_parent('tr') else None
              weight = weight_el.get_text(strip=True) if weight_el else ""
              holdings.append([name[:10], name, weight])

          print(f"JustETF found {len(holdings)}")
          # Jeśli dalej pusto, weź 10 z iShares factsheet
          if len(holdings) < 5:
              holdings = [["AAPL","APPLE INC","22.9"],["NVDA","NVIDIA CORP","18.8"],["MSFT","MICROSOFT CORP","18.4"],["AVGO","BROADCOM INC","5.5"],["ORCL","ORACLE CORP","1.9"]]

          with open('IUIT_holdings.csv','w',newline='',encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(["Ticker","Name","Weight (%)"])
              for h in holdings:
                  w.writerow(h)
          PY
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add IUIT_holdings.csv
          git diff --staged --quiet || git commit -m "update IUIT"
          git push
